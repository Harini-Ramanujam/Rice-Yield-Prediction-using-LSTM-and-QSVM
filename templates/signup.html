<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Agriculture AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            line-height: 1.6; 
            color: #2d3748; 
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Header - matches landing page */
        header { 
            background: rgba(76, 175, 80, 0.95); 
            backdrop-filter: blur(20px);
            padding: 1rem 2rem; 
            position: sticky; 
            top: 0; 
            z-index: 100;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 { 
            font-size: clamp(1.2rem, 3vw, 1.8rem); 
            color: white; 
            font-weight: 700; 
        }
        h1 .emoji { font-size: 1.3em; margin-right: 0.5rem; }
        nav a { 
            color: white; 
            text-decoration: none; 
            padding: 0.6rem 1.2rem; 
            border-radius: 50px; 
            font-weight: 500; 
            transition: all 0.3s; 
            border: 2px solid rgba(255,255,255,0.3); 
            margin-left: 0.5rem;
            font-size: 0.9rem;
        }
        nav a:hover { 
            background: white; 
            color: #4CAF50; 
            transform: translateY(-2px); 
        }

        /* Main content */
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            flex: 1; 
            display: flex; 
            flex-direction: column;
            justify-content: center;
        }

        /* Form card */
        .form-card {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .form-card h2 {
            text-align: center;
            font-size: 2.2rem;
            color: #1a202c;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafbfc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
            background: white;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            transform: translateY(-1px);
        }

        /* Submit button */
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 1.2rem;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* Login link */
        .login-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .login-link a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            header { padding: 1rem; margin-bottom: 1rem; }
            .form-card { padding: 2rem; }
            .form-card h2 { font-size: 1.8rem; }
        }

        @media (max-width: 480px) {
            header { flex-direction: column; gap: 1rem; text-align: center; }
            nav a { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="emoji">🌱</span>Smart Agriculture AI</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-card">
            <h2>Create Your Farm Account</h2>
            
            <form method="POST">
                <div class="form-group">
                    <label for="username">Farm Username</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Enter your farm username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Create a secure password">
                </div>

                <button type="submit">Create Account</button>
            </form>

            <div class="login-link">
                <p>Already have an account? <a href="/login">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
